name: Maven service CI

# Shared pipeline for the four build-identical Maven services (api-gateway,
# game-service, library-service, recommendation-service). Each service repo holds a
# thin caller that supplies only its image name. Editing this file changes all four.

on:
  workflow_call:
    inputs:
      image-name:
        description: "Image name under ghcr.io/the-game-cellar"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # JDK 21 matches maven:3.9-eclipse-temurin-21 in the Dockerfile and the
      # 21-jre-alpine runtime stage. maven.compiler.release stays 17 from the pom,
      # so bytecode target is unchanged.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/the-game-cellar/${{ inputs.image-name }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # Builds on every trigger so a pull request proves the image still assembles,
      # but only main publishes. The Dockerfile recompiles the source it just tested;
      # the gha cache makes that a layer hit rather than a second cold build.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
